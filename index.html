<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A6E7C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ел. дневник">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}*{-webkit-tap-highlight-color:transparent}html,body{max-width:100%;overflow-x:hidden}</style>
<title>Ел. дневник ЕТО</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F3;--surface:#FFFFFF;--surface2:#E2E8EC;--ink:#12202B;--muted:#566874;
  --line:#CAD4DB;--accent:#0A6E7C;--accentInk:#FFFFFF;--accentSoft:#D7ECEF;
  --ok:#23804F;--warn:#9A6200;--bad:#BE3527;--okbg:#E0F1E7;--warnbg:#FAEFD6;--badbg:#FAE2DE;
  --shadow:0 1px 2px rgba(18,32,43,.07);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0B151C;--surface:#13212B;--surface2:#1B2D39;--ink:#E3EBEF;--muted:#8DA1AE;--line:#2A3D4A;
  --accent:#3AB2C2;--accentInk:#062129;--accentSoft:#113640;
  --ok:#4DC08A;--warn:#E2A83A;--bad:#F07264;--okbg:#10301F;--warnbg:#382A0C;--badbg:#3B1914;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0B151C;--surface:#13212B;--surface2:#1B2D39;--ink:#E3EBEF;--muted:#8DA1AE;--line:#2A3D4A;
  --accent:#3AB2C2;--accentInk:#062129;--accentSoft:#113640;
  --ok:#4DC08A;--warn:#E2A83A;--bad:#F07264;--okbg:#10301F;--warnbg:#382A0C;--badbg:#3B1914;--shadow:none}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 16px 6px;max-width:880px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.date{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 12px 8px;max-width:880px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid transparent;background:none;padding:7px 12px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
nav button[aria-current="true"]{background:var(--accent);color:var(--accentInk)}
nav .cnt{font-family:var(--f-mono);font-size:11px;font-weight:500;background:var(--badbg);color:var(--bad);border-radius:999px;padding:0 6px}
nav button[aria-current="true"] .cnt{background:var(--accentInk);color:var(--accent)}

main{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:16px 96px;display:flex;flex-direction:column;gap:16px}
.demo{font-size:13px;background:var(--accentSoft);color:var(--ink);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.demo button{border:none;background:none;color:var(--accent);font-weight:600;padding:0}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar h2{flex:1 1 auto}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accentSoft);font-weight:600}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;padding:12px 14px 12px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:none;border-right:none;border-bottom:none;width:100%;align-items:start}
.item:first-child{border-top:none}
.item:hover{background:var(--surface2)}
.stripe{align-self:stretch;border-radius:0 3px 3px 0;background:transparent}
.s-bad .stripe{background:var(--bad)}.s-warn .stripe{background:var(--warn)}.s-ok .stripe{background:var(--ok)}.s-mute .stripe{background:var(--line)}
.it-title{font-weight:600;overflow-wrap:anywhere}
.it-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.it-meta .tag{font-family:var(--f-mono);font-size:12px;color:var(--ink)}
.it-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-bad{background:var(--badbg);color:var(--bad)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-ok{background:var(--okbg);color:var(--ok)}.p-mute{background:var(--surface2);color:var(--muted)}.p-acc{background:var(--accentSoft);color:var(--accent)}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.tile b{font-family:var(--f-mono);font-size:28px;font-weight:500;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}.tile.ok b{color:var(--ok)}
section{display:flex;flex-direction:column;gap:8px}

.spark{display:block}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:1.6}
.spark .ar{fill:var(--accentSoft)}
.spark .gd{stroke:var(--line);stroke-width:1}
.spark .dt{fill:var(--accent)}
.spark.bad .ln{stroke:var(--bad)}.spark.bad .dt{fill:var(--bad)}.spark.bad .ar{fill:var(--badbg)}
.big{font-family:var(--f-mono);font-size:17px;font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hand{font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;background:var(--surface2);border-radius:8px;padding:12px;overflow-x:auto;max-height:340px;overflow-y:auto}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(6,14,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.veil{align-items:center}.sheet{border-radius:14px}}
.sheet h2{font-size:20px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;padding-top:4px}
.acts .r{display:flex;gap:8px;margin-left:auto}
.photo img{max-height:180px;border-radius:8px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl td,.tbl th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.tbl td.n{font-family:var(--f-mono);text-align:right}
.hist{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head>
<body>
<header>
  <div class="hrow">
    <div class="brand" id="brand">Ел. дневник<small id="shipName">Кораб</small></div>
    <div class="date num" id="today"></div>
  </div>
  <nav id="nav" aria-label="Модули"></nav>
</header>
<main id="main"></main>
<div id="sheetHost"></div>

<script>
(function(){
const KEY='etoLogbook.v1';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const fmt=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return d+'.'+m+'.'+y.slice(2)};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SYSTEMS=['ВН / HV разпределение','НН / LV разпределение','Генериране','Задвижване','Аварийни системи','Пожарна безопасност','HVAC','Камбуз','Асансьори','Осветление','Хотел / кабини','Навигация и комуникации','Друго'];
const PRIOS=['Спешна','Висока','Нормална','Ниска'];
const JSTAT=['Отворена','В работа','Чака части','Затворена'];
const MTYPES={'IR':'Изолация, MΩ','I':'Ток, A','T':'Температура, °C','U':'Напрежение, V','V':'Вибрации, mm/s'};
const RES=['OK','Със забележка','Неуспешен'];

/* ---------- data ---------- */
function sample(){
  const t=today(),D=n=>addDays(t,n);
  const E=[
    ['HV-SWBD-1','ГРЩ 11 kV, преден','ВН / HV разпределение','Deck 1, MVZ 3, Fr 98','ABB UniGear'],
    ['DG-3','Дизел-генератор 3, алтернатор','Генериране','Deck 1, MVZ 4, Fr 120','Wärtsilä / ABB AMG'],
    ['AZ-PS','Азипод ЛБ, пропулсивен двигател','Задвижване','Deck 0, кърма, Fr 12','ABB Azipod'],
    ['EG-1','Авариен генератор','Аварийни системи','Deck 12, MVZ 5',''],
    ['GAL-4-DW','Съдомиялна, основен камбуз','Камбуз','Deck 4, MVZ 3','Hobart'],
    ['AHU-12','Климатична централа 12, вентилатор','HVAC','Deck 7, MVZ 2, Fr 176',''],
    ['LIFT-C3','Пътнически асансьор C3','Асансьори','Deck 3–14, MVZ 4','KONE'],
    ['FD-L5','Пожароизвестяване, контур 5','Пожарна безопасност','Deck 5, MVZ 1–2','Consilium']
  ].map(a=>({id:uid(),tag:a[0],name:a[1],system:a[2],loc:a[3],maker:a[4],notes:''}));
  const e=i=>E[i].id;
  return {
    meta:{ship:'Примерен кораб',irMin:1,demo:true},
    equipment:E,
    jobs:[
      {id:uid(),date:D(0),title:'Не работи контакт до бюрото',loc:'Cabin 8214',equip:'',prio:'Нормална',status:'Отворена',ptw:'',desc:'Докладвано от стюард, 09:40.',action:'',parts:'',photo:''},
      {id:uid(),date:D(-2),title:'Повишен ток на вентилатора',loc:'Deck 7, MVZ 2',equip:e(5),prio:'Висока',status:'В работа',ptw:'PTW-2291',desc:'Токът расте от 18 до 22 A за месец.',action:'Проверени лагери, шум от NDE страна. Предстои смяна.',parts:'Лагер 6310-2Z ×1',photo:''},
      {id:uid(),date:D(-4),title:'Изгорял нагревател на бойлера',loc:'Основен камбуз',equip:e(4),prio:'Висока',status:'Чака части',ptw:'',desc:'Водата не достига 82 °C.',action:'Нагревателят е с прекъсната спирала. Поръчан.',parts:'Heater 9 kW, PN 4431-22',photo:''},
      {id:uid(),date:D(-6),title:'Мигащо LED осветление в галерията',loc:'Deck 5, Promenade',equip:'',prio:'Ниска',status:'Затворена',ptw:'',desc:'',action:'Сменен драйвер 350 mA.',parts:'LED драйвер ×1',photo:''}
    ],
    pms:[
      {id:uid(),equip:e(1),task:'Четки и контактни пръстени: проверка и почистване',interval:90,last:D(-80),notes:'',hist:[D(-170),D(-80)]},
      {id:uid(),equip:e(2),task:'Изолационно съпротивление на статора',interval:30,last:D(-34),notes:'Мегер 5 kV, 1 мин.',hist:[D(-64),D(-34)]},
      {id:uid(),equip:e(0),task:'Термовизия на шини и кабелни връзки',interval:180,last:D(-60),notes:'',hist:[D(-60)]},
      {id:uid(),equip:e(6),task:'Спирачка и крайни изключватели',interval:30,last:D(-25),notes:'Заедно с техника на KONE.',hist:[D(-55),D(-25)]},
      {id:uid(),equip:e(5),task:'Смазване на лагерите на двигателя',interval:60,last:D(-10),notes:'',hist:[D(-10)]}
    ],
    meas:[
      ...[2400,2150,1900,1620,1310].map((v,i)=>({id:uid(),date:D(-120+i*30),equip:e(2),type:'IR',value:v,notes:''})),
      ...[18.2,18.4,19.1,20.6,22.3].map((v,i)=>({id:uid(),date:D(-28+i*7),equip:e(5),type:'I',value:v,notes:''})),
      ...[71,72,74,76,78].map((v,i)=>({id:uid(),date:D(-20+i*5),equip:e(1),type:'T',value:v,notes:'Лагер NDE'})),
      ...[0.9,0.7].map((v,i)=>({id:uid(),date:D(-14+i*14),equip:e(4),type:'IR',value:v,notes:'Нагревател'}))
    ],
    tests:[
      {id:uid(),name:'Авариен генератор: пуск и поемане на товар',interval:7,last:D(-6),result:'OK',notes:'',hist:[]},
      {id:uid(),name:'Нисколокализирано осветление (LLL): обход',interval:30,last:D(-31),result:'Със забележка',notes:'2 секции тъмни на Deck 9.',hist:[]},
      {id:uid(),name:'Аварийно осветление: тест на батериите',interval:30,last:D(-12),result:'OK',notes:'',hist:[]},
      {id:uid(),name:'Пожароизвестяване: детектори по ротация',interval:7,last:D(-3),result:'OK',notes:'Тази седмица: контур 5.',hist:[]},
      {id:uid(),name:'Водонепроницаеми врати: работа и индикация',interval:7,last:D(-8),result:'OK',notes:'',hist:[]},
      {id:uid(),name:'PA и General Alarm',interval:7,last:D(-2),result:'OK',notes:'',hist:[]},
      {id:uid(),name:'Аварийни акумулатори 24 V: напрежение и плътност',interval:7,last:D(-5),result:'OK',notes:'',hist:[]}
    ],
    parts:[
      {id:uid(),pn:'4431-22',name:'Нагревател 9 kW за съдомиялна',qty:0,min:2,loc:'Store E2, рафт 4'},
      {id:uid(),pn:'LD-350',name:'LED драйвер 350 mA',qty:14,min:10,loc:'Store E1, кутия 12'},
      {id:uid(),pn:'LC1D40',name:'Контактор 3P 40 A, 230 V бобина',qty:3,min:4,loc:'Store E1, рафт 2'},
      {id:uid(),pn:'gG16',name:'Предпазител gG 16 A, 10×38',qty:60,min:30,loc:'Store E1, чекмедже 3'},
      {id:uid(),pn:'EG34',name:'Четки за алтернатор DG, EG34',qty:6,min:12,loc:'Store E2, рафт 1'},
      {id:uid(),pn:'6310-2Z',name:'Лагер 6310-2Z',qty:2,min:2,loc:'Store E2, рафт 3'}
    ],
    hand:[
      {id:uid(),date:D(-1),text:'DG-3: следи температурата на лагера NDE. Последно 78 °C, расте с около 1,5 °C на 5 дни.',pin:true},
      {id:uid(),date:D(-3),text:'Нагревателят за съдомиялната е поръчан. Очакван в следващото пристанище.',pin:false}
    ]
  };
}
function empty(){return {meta:{ship:'',irMin:1,demo:false},equipment:[],jobs:[],pms:[],meas:[],tests:[],parts:[],hand:[]}}
let db;
function load(){try{const s=localStorage.getItem(KEY);if(s){db=JSON.parse(s);return}}catch(e){}db=sample()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Паметта е пълна. Изтрий снимки или направи архив.');return false}}
load();

/* ---------- helpers ---------- */
const eq=id=>db.equipment.find(x=>x.id===id);
const eqLabel=id=>{const x=eq(id);return x?x.tag:''};
function due(last,interval){if(!last)return{days:-1,cls:'bad',txt:'Не е правено'};const next=addDays(last,+interval);const d=diff(next,today());return{next,days:d,cls:d<0?'bad':d<=Math.min(7,Math.ceil(interval/4))?'warn':'ok',txt:d<0?'Просрочено '+(-d)+' дни':d===0?'Днес':'След '+d+' дни'}}
const jobCls=j=>j.status==='Затворена'?'mute':j.prio==='Спешна'||j.prio==='Висока'?'bad':j.status==='Чака части'?'warn':'ok';
const measGroups=()=>{const g={};db.meas.forEach(m=>{const k=m.equip+'|'+m.type;(g[k]=g[k]||[]).push(m)});return Object.entries(g).map(([k,a])=>{a.sort((x,y)=>x.date<y.date?-1:1);const [equip,type]=k.split('|');return{equip,type,list:a,last:a[a.length-1],first:a[0]}})};
const irAlert=g=>g.type==='IR'&&(+g.last.value<+db.meta.irMin);
const trendPct=g=>g.list.length>1&&+g.first.value?Math.round((g.last.value-g.first.value)/g.first.value*100):0;
function counts(){
  return{
    jobs:db.jobs.filter(j=>j.status!=='Затворена').length,
    pms:db.pms.filter(p=>due(p.last,p.interval).days<0).length,
    tests:db.tests.filter(t=>due(t.last,t.interval).days<0).length,
    parts:db.parts.filter(p=>+p.qty<+p.min).length,
    meas:measGroups().filter(irAlert).length
  }
}
function spark(vals,bad){
  const w=120,h=34,p=3;if(vals.length<2)return '';
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1),h-p-(v-mn)/r*(h-2*p)]);
  const l=pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  const L=pts[pts.length-1];

function openForm(kind,id,preset){

  const cfg=F[kind];photoData=rec.photo||'';
  let h=`<h2>${id?'':'Нов запис: '}${cfg.title}</h2><form id="frm" class="fld-wrap" style="display:flex;flex-direction:column;gap:12px">`;
  cfg.fields().forEach(([k,l,t,req,opts])=>{
    const v=rec[k]??'',fid='f_'+kind+'_'+k;
    if(t==='check'){h+=`<label class="chk"><input type="checkbox" id="${fid}" name="${k}" ${v?'checked':''}> ${l}</label>`;return}
    h+=`<div class="fld"><label for="${fid}">${l}${req?' *':''}</label>`;
    if(t==='select')h+=`<select id="${fid}" name="${k}" ${req?'required':''}>`+opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return`<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')+`</select>`;
    else if(t==='textarea')h+=`<textarea id="${fid}" name="${k}" ${req?'required':''}>${esc(v)}</textarea>`;
    else if(t==='photo')h+=`<input type="file" id="${fid}" accept="image/*"><div class="photo" id="photoPrev">${v?`<img src="${v}" alt="Снимка към заявката">`:''}</div>`;
    else h+=`<input id="${fid}" name="${k}" type="${t}" ${t==='number'?'step="any" inputmode="decimal"':''} value="${esc(v)}" ${req?'required':''}>`;
    h+=`</div>`;
  });
  if(rec.hist&&rec.hist.length)h+=`<div class="hist">История: ${rec.hist.slice().reverse().map(fmt).join(', ')}</div>`;
  h+=`<div class="acts">${id?'<button type="button" class="btn danger" id="del">Изтрий</button>':''}<div class="r"><button type="button" class="btn" id="cancel">Отказ</button><button class="btn pri">Запази</button></div></div></form>`;
  const s=sheet(h);
  const ph=s.querySelector('input[type=file]');
  if(ph)ph.addEventListener('change',()=>{const f=ph.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.7);s.querySelector('#photoPrev').innerHTML=`<img src="${photoData}" alt="Снимка към заявката">`};img.src=r.result};r.readAsDataURL(f)});
  s.querySelector('#cancel').onclick=closeSheet;
  const del=s.querySelector('#del');
  if(del)del.onclick=()=>{if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='Потвърди изтриването';return}db[kind]=db[kind].filter(x=>x.id!==id);save();closeSheet();render();toast('Изтрито')};
  s.querySelector('#frm').onsubmit=ev=>{
    ev.preventDefault();const fd=new FormData(ev.target);const o=id?rec:{id:uid()};
    cfg.fields().forEach(([k,,t])=>{if(t==='check')o[k]=ev.target.querySelector('[name='+k+']').checked;else if(t==='photo')o[k]=photoData;else if(t==='number'){const n=fd.get(k);o[k]=n===''?'':+n}else o[k]=fd.get(k)});
    if((kind==='pms'||kind==='tests')&&o.last){o.hist=o.hist||[];if(!o.hist.includes(o.last))o.hist.push(o.last)}
    if(!id)db[kind].push(o);
    if(db.meta.demo){} save();closeSheet();render();toast(id?'Промените са запазени':'Добавено');
  };
}

  <div class="bar"><button class="btn sm" data-sub="jobs">+ Заявка</button><button class="btn sm" data-sub="pms">+ Задача</button><button class="btn sm" data-sub="meas">+ Измерване</button><button class="btn sm" id="ed">Редактирай</button></div>
  <h3>Планова поддръжка</h3><div class="list">${P.length?P.map(pmsItem).join(''):'<div class="empty">Няма задачи.</div>'}</div>
  <h3>Измервания</h3><div class="list">${G.length?G.map(measItem).join(''):'<div class="empty">Няма измервания.</div>'}</div>
  <h3>История на ремонтите</h3><div class="list">${J.length?J.map(jobItem).join(''):'<div class="empty">Няма записи.</div>'}</div>
  <div class="acts"><div class="r"><button class="btn" id="cl">Затвори</button></div></div>`);
  s.querySelector('#cl').onclick=closeSheet;s.querySelector('#ed').onclick=()=>openForm('equipment',id);
  s.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>openForm(b.dataset.sub,null,{equip:id}));
}
function measSheet(key){const[eid,type]=key.split('|');const g=measGroups().find(x=>x.equip===eid&&x.type===type);const e=eq(eid);
  const s=sheet(`<div><div class="hist num">${esc(e?e.tag:'')}</div><h2>${MTYPES[type]}</h2><div class="hist">${esc(e?e.name:'')}</div></div><div>${spark(g.list.map(m=>+m.value),irAlert(g)).replace('width="120" height="34"','width="100%" height="80" preserveAspectRatio="none"')}</div>
  <div class="tbl"><table><thead><tr><th>Дата</th><th style="text-align:right">Стойност</th><th>Бележки</th></tr></thead><tbody>${g.list.slice().reverse().map(m=>`<tr data-edit="meas" data-id="${m.id}" style="cursor:pointer"><td class="num">${fmt(m.date)}</td><td class="n">${m.value}</td><td>${esc(m.notes)}</td></tr>`).join('')}</tbody></table></div>
  <div class="acts"><button class="btn pri" id="add">+ Ново замерване</button><div class="r"><button class="btn" id="cl">Затвори</button></div></div>`);
  s.querySelector('#cl').onclick=closeSheet;s.querySelector('#add').onclick=()=>openForm('meas',null,{equip:eid,type});
  s.querySelectorAll('[data-edit]').forEach(r=>r.onclick=()=>openForm('meas',r.dataset.id));
}

function render(){
  document.getElementById('shipName').textContent=db.meta.ship||'Кораб';
  document.getElementById('today').textContent=fmt(today());
  nav();const m=document.getElementById('main');m.innerHTML=V[tab]();
  const q=m.querySelector('#q');if(q){q.oninput=()=>{ui.q=q.value;const pos=q.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)}}
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-new],[data-edit],[data-done],[data-q],[data-go],[data-jf],[data-ef],[data-eq],[data-mg],[data-act]');if(!t)return;
  const inSheet=!!t.closest('.sheet');const d=t.dataset;
  if(d.new)return openForm(d.new);
  if(d.done){const o=db[d.done].find(x=>x.id===d.id);o.last=today();o.hist=o.hist||[];if(!o.hist.includes(o.last))o.hist.push(o.last);if(d.done==='tests')o.result='OK';save();if(inSheet){const eid=o.equip;closeSheet();render();eid&&equipSheet(eid)}else render();return toast('Отбелязано за днес')}
  if(d.edit){if(inSheet&&t.tagName==='TR')return;return openForm(d.edit,d.id)}
  if(d.q){const p=db.parts.find(x=>x.id===d.id);p.qty=Math.max(0,+p.qty+ +d.q);save();return render()}
  if(d.go){tab=d.go;try{history.replaceState(null,'','#'+tab)}catch(_){}render();return window.scrollTo(0,0)}
  if(d.jf!==undefined){ui.jf=d.jf;return render()}
  if(d.ef!==undefined){ui.ef=d.ef;return render()}
  if(d.eq)return equipSheet(d.eq);
  if(d.mg)return measSheet(d.mg);
  const a=d.act;
  if(a==='wipe'||a==='wipe2'){if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='Сигурен ли си? Натисни пак';return}db=empty();save();tab='dash';render();return toast('Всичко е изтрито')}
  if(a==='demo'){db=sample();save();tab='dash';render();return toast('Заредени са примерните данни')}
  if(a==='saveSet'){db.meta.ship=document.getElementById('s_ship').value.trim();db.meta.irMin=+document.getElementById('s_ir').value||1;save();render();return toast('Запазено')}
  if(a==='copyHand'||a==='exp'){const txt=a==='exp'?JSON.stringify(db):handText();try{await navigator.clipboard.writeText(txt);toast('Копирано')}catch(_){const ta=document.getElementById(a==='exp'?'imp':'handText');if(a==='exp'){ta.value=txt;ta.select()}else{const r=document.createRange();r.selectNodeContents(ta);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Текстът е маркиран. Копирай го ръчно.')}return}
  if(a==='imp'){const ta=document.getElementById('imp');const f=document.getElementById('impf').files[0];let txt=ta.value.trim();if(!txt&&f)txt=await f.text();
    try{const o=JSON.parse(txt);if(!o||!Array.isArray(o.equipment)||!Array.isArray(o.jobs))throw 0;db=Object.assign(empty(),o);db.meta.demo=false;save();tab='dash';render();toast('Архивът е възстановен')}catch(_){toast('Текстът не е валиден архив от това приложение')}}
});
render();
})();
</script>

</body>
</html>
